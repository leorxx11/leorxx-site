<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leo's corner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="robots" content="noindex">
<title>暗房 Darkroom</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/main.js"></script>
</head>
<body>
<div class="page">
  <header class="masthead">
    <a class="issue" href="/">Leo's corner · 第 02 栏</a>
    <nav class="tabs" id="tabs" hidden>
      <a href="#develop" data-view="develop">冲洗台</a>
      <a href="#library" data-view="library">底片库</a>
      <a href="#settings" data-view="settings">设置</a>
    </nav>
    <a class="home" href="/">← 首页</a>
  </header>

  <section class="hero">
    <h1 class="title">暗房<em>Darkroom.</em></h1>
    <p class="deck">把照片丢进来，冲洗成一条链接。底片存在 R2，冲洗记录只有你看得见。</p>
  </section>

  <!-- 进门 -->
  <section class="view login" id="view-login" hidden>
    <h2 class="kicker"><b>进门</b><i>Knock knock</i></h2>
    <div id="login-passkey" hidden>
      <button class="btn solid" id="login-btn" type="button">用通行密钥进入</button>
      <p class="aside"><button class="link" id="show-setup" type="button">在新设备上用初始化码绑定</button></p>
    </div>
    <form id="setup-form" hidden novalidate>
      <div class="field">
        <input id="setup-code" placeholder="初始化码" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" aria-label="初始化码">
        <button class="btn" type="submit">绑定通行密钥 →</button>
      </div>
      <p class="aside" id="back-login" hidden><button class="link" type="button">← 用已有的通行密钥进入</button></p>
    </form>
    <p class="err" id="login-err" role="alert"></p>
  </section>

  <!-- 冲洗台 -->
  <main class="view" id="view-develop" hidden>
    <h2 class="kicker"><b>冲洗台</b><i>Develop</i></h2>
    <label class="drop" id="drop">
      <input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/avif" multiple>
      <span>
        <strong>把照片放这里。</strong>
        <small>拖进来、点一下选文件，或者直接 <kbd>⌘ V</kbd> 粘贴截图</small>
      </span>
    </label>
    <div class="opts">
      <label title="PNG 和 JPEG 会在浏览器里重新编码，顺带抹掉 EXIF 和定位；GIF 保持原样"><input type="checkbox" id="opt-webp"> 转成 WebP</label>
      <label>质量 <input type="range" id="opt-quality" min="50" max="100" step="1"> <span id="opt-quality-out"></span></label>
      <label>最大宽度
        <select id="opt-width">
          <option value="0">不限</option>
          <option value="3840">3840</option>
          <option value="2560">2560</option>
          <option value="1920">1920</option>
          <option value="1280">1280</option>
        </select>
      </label>
      <span class="spacer"></span>
      <span class="fmt-pick">复制为 <span class="seg" data-fmt-switch></span></span>
    </div>
    <ul class="queue" id="queue"></ul>
  </main>

  <!-- 底片库 -->
  <main class="view" id="view-library" hidden>
    <div class="lib-bar">
      <span class="seg big" id="lib-mode">
        <button type="button" data-mode="sheet" aria-pressed="true">底片</button>
        <button type="button" data-mode="trash" aria-pressed="false">废纸篓 <span id="trash-count"></span></button>
      </span>
      <span class="spacer"></span>
      <input type="search" id="lib-q" placeholder="搜原文件名" aria-label="搜原文件名">
      <select id="lib-month" aria-label="按月份筛选"><option value="">全部月份</option></select>
      <button class="link" type="button" id="lib-multi">多选</button>
    </div>
    <div class="selbar" id="selbar" hidden>
      <span>已选 <b id="sel-count">0</b> 张</span>
      <span class="spacer"></span>
      <span class="sheet-only"><button class="link" type="button" id="sel-copy">复制链接</button></span>
      <span class="sheet-only"><button class="link danger" type="button" id="sel-trash">移到废纸篓</button></span>
      <span class="trash-only"><button class="link" type="button" id="sel-restore">恢复</button></span>
      <span class="trash-only"><button class="link danger" type="button" id="sel-purge">彻底删除</button></span>
      <button class="link" type="button" id="sel-cancel">取消</button>
    </div>
    <div class="lib">
      <div class="lib-main">
        <div id="groups"></div>
        <div id="sentinel"></div>
        <p class="empty" id="lib-empty" hidden></p>
        <p class="trash-only aside" id="trash-tools" hidden>
          图片在废纸篓里放 <span id="trash-days">30</span> 天后会被彻底删除。
          <button class="link danger" type="button" id="trash-empty">现在清空</button>
        </p>
      </div>
      <aside class="detail" id="detail" aria-live="polite"></aside>
    </div>
  </main>

  <!-- 设置 -->
  <main class="view" id="view-settings" hidden>
    <h2 class="kicker"><b>通行密钥</b><i>Passkeys</i></h2>
    <ul class="rows" id="passkeys"></ul>
    <p class="aside"><button class="link" type="button" id="add-passkey">在这台设备上再添加一把</button></p>

    <h2 class="kicker"><b>登录</b><i>Sessions</i></h2>
    <p class="aside">
      <span id="session-count"></span>
      <button class="link" type="button" id="logout-others">退出其他设备</button>
      · <button class="link" type="button" id="logout">退出这台设备</button>
    </p>

    <h2 class="kicker"><b>用量</b><i>Storage</i></h2>
    <div class="usage" id="usage"></div>
  </main>

  <footer class="colophon">
    <span>© leorxx</span>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>
</body>
</html>
